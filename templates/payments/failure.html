{% extends 'base.html' %}

{% block title %}Payment Failed{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-50 to-white py-12 px-4">
    <div class="max-w-md mx-auto text-center">
        <div class="bg-white rounded-lg shadow-lg p-8">
            <div class="text-red-500 text-6xl mb-4">✗</div>
            <h1 class="text-3xl font-bold text-gray-900 mb-4">Payment Failed</h1>
            <p class="text-gray-600 mb-6">We couldn't process your payment</p>
            
            <a href="{% url 'payments:checkout' %}" class="block w-full bg-primary-500 hover:bg-primary-600 text-white font-semibold py-3 rounded-lg transition-colors">
                Try Again
            </a>
        </div>
    </div>
</div>
{% endblock %}
