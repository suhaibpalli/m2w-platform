<!-- templates/payments/failed.html -->
{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 text-center">
        <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-red-100 mb-4">
            <svg class="h-10 w-10 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </div>
        
        <h2 class="text-3xl font-bold text-gray-900 mb-2">Payment Failed</h2>
        <p class="text-gray-600 mb-6">We couldn't process your payment</p>
        
        <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-6 text-sm text-left">
            <p class="text-gray-700 mb-2">Please check:</p>
            <ul class="list-disc list-inside text-gray-600 space-y-1">
                <li>Card number is correct</li>
                <li>CVV/CVC code is valid</li>
                <li>Card expiry date is correct</li>
                <li>Sufficient funds available</li>
            </ul>
        </div>
        
        <div class="space-y-3">
            <a href="{% url 'payments:checkout' %}" class="block w-full bg-red-600 text-white py-3 rounded-lg font-semibold hover:bg-red-700 transition">
                Try Again
            </a>
            <a href="{% url 'accounts:profile' %}" class="block w-full bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300 transition">
                Back to Profile
            </a>
        </div>
    </div>
</div>
{% endblock %}
